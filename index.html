<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#b45309" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TATU FAZ" />
    <meta name="description" content="TATU FAZ - Sistema de Registro Arqueológico (Engenheiros do Açaí)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
    <title>TATU FAZ - Sistema de Registro Arqueológico</title>
    <script>
      // Se o usuário abrir o index.html da pasta raiz diretamente com duplo-clique (file://),
      // redireciona automaticamente para a versão compilada autocontida em dist/index.html
      if (window.location.protocol === 'file:' && !window.location.pathname.includes('/dist/') && !window.location.pathname.endsWith('TATU_FAZ_App.html')) {
        window.location.replace('./dist/index.html');
      }
    </script>
  </head>
  <body class="bg-gray-100 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
