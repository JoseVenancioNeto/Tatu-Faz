name: Gerar APK Android (TATU FAZ)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar TATU FAZ APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 21 (necessário para Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências npm
        run: npm install --legacy-peer-deps

      - name: Compilar Web App (Vite)
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Dar permissão ao Gradlew e Compilar APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../TATU-FAZ.apk

      - name: Publicar APK na aba Actions
        uses: actions/upload-artifact@v4
        with:
          name: TATU-FAZ-Android-APK
          path: TATU-FAZ.apk
          if-no-files-found: error

      - name: Publicar APK pronto na aba Releases do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "TATU FAZ - Aplicativo Android (APK)"
          body: "Clique em **TATU-FAZ.apk** abaixo para baixar e instalar diretamente no celular Android."
          files: TATU-FAZ.apk
          prerelease: false
